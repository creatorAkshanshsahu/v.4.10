# XcodeGen project for AK TV on iPhone / iPad.  Generate the Xcode project with:  xcodegen generate
name: AKTV
options:
  bundleIdPrefix: com.akshansh
  deploymentTarget:
    iOS: "17.0"
targets:
  AKTV:
    type: application
    platform: iOS
    sources:
      - path: AKTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshansh.aktv
        PRODUCT_NAME: AK TV
        MARKETING_VERSION: 5.0.0
        CURRENT_PROJECT_VERSION: 25
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AK TV
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: 5.9
